<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MandateGuard Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; }
        .header { background: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; color: #38bdf8; }
        .header .status { font-size: 13px; color: #94a3b8; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px; }
        .card { background: #1e293b; border-radius: 8px; border: 1px solid #334155; padding: 20px; }
        .card h2 { font-size: 14px; color: #94a3b8; text-transform: uppercase; margin-bottom: 12px; }
        .stat { font-size: 32px; font-weight: bold; color: #38bdf8; }
        .full-width { grid-column: 1 / -1; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 8px 12px; color: #94a3b8; border-bottom: 1px solid #334155; }
        td { padding: 8px 12px; border-bottom: 1px solid #1e293b; }
        tr:hover { background: #334155; }
        .risk-critical { color: #ef4444; font-weight: bold; }
        .risk-high { color: #f97316; font-weight: bold; }
        .risk-medium { color: #eab308; }
        .risk-low { color: #22c55e; }
        #graph-container { width: 100%; height: 500px; position: relative; overflow: hidden; }
        canvas { display: block; }
        .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .btn { padding: 6px 16px; border: 1px solid #475569; background: #334155; color: #e2e8f0; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn:hover { background: #475569; }
        .btn.primary { background: #0ea5e9; border-color: #0ea5e9; }
        .btn.primary:hover { background: #0284c7; }
        .btn.danger { background: #ef4444; border-color: #ef4444; }
        #status-msg { padding: 4px 12px; font-size: 12px; color: #94a3b8; }
        .legend { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="header">
        <h1>MandateGuard</h1>
        <div class="status">
            <span id="status-msg">Connecting...</span>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Total Transactions</h2>
            <div class="stat" id="total-tx">-</div>
        </div>
        <div class="card">
            <h2>Active Alerts</h2>
            <div class="stat" id="active-alerts" style="color: #ef4444;">-</div>
        </div>
        <div class="card">
            <h2>Agents</h2>
            <div class="stat" id="total-agents">-</div>
        </div>
        <div class="card">
            <h2>Fraud Rate</h2>
            <div class="stat" id="fraud-rate" style="color: #f97316;">-</div>
        </div>

        <div class="card full-width">
            <h2>Transaction Graph <span style="font-weight:normal;font-size:12px;color:#64748b">(force-directed layout)</span></h2>
            <div class="controls">
                <button class="btn primary" onclick="loadGraph()">Refresh Graph</button>
                <button class="btn" onclick="runSimulation()">Run Simulation</button>
                <button class="btn" onclick="trainModel()">Train Models</button>
            </div>
            <div class="legend">
                <div class="legend-item"><div class="legend-dot" style="background:#38bdf8"></div> Normal</div>
                <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> High Risk</div>
                <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div> Medium Risk</div>
                <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div> Low Risk</div>
            </div>
            <div id="graph-container">
                <canvas id="graph-canvas"></canvas>
            </div>
        </div>

        <div class="card full-width">
            <h2>Recent Alerts</h2>
            <table>
                <thead>
                    <tr><th>Alert ID</th><th>Agent</th><th>Risk Level</th><th>Score</th><th>Reason</th><th>Time</th></tr>
                </thead>
                <tbody id="alerts-table"></tbody>
            </table>
        </div>

        <div class="card full-width">
            <h2>Recent Transactions</h2>
            <table>
                <thead>
                    <tr><th>Tx ID</th><th>From</th><th>To</th><th>Amount</th><th>Fraud</th><th>Time</th></tr>
                </thead>
                <tbody id="tx-table"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = {
            ledger: 'http://localhost:8082/ledger',
            policy: 'http://localhost:8085/api',
            simulator: 'http://localhost:8081/simulate',
            detection: 'http://localhost:8084/detect',
            features: 'http://localhost:8083/features',
        };

        async function fetchJSON(url) {
            try {
                const resp = await fetch(url);
                if (!resp.ok) return null;
                return await resp.json();
            } catch { return null; }
        }

        async function updateStats() {
            const stats = await fetchJSON(`${API.ledger}/stats`);
            if (stats) document.getElementById('total-tx').textContent = stats.totalTransactions.toLocaleString();
            const alerts = await fetchJSON(`${API.policy}/alerts/unresolved`);
            if (alerts) document.getElementById('active-alerts').textContent = alerts.length;
            document.getElementById('status-msg').textContent = 'Connected';
        }

        async function updateAlerts() {
            const alerts = await fetchJSON(`${API.policy}/alerts?limit=20`);
            const tbody = document.getElementById('alerts-table');
            if (!alerts || alerts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="color:#64748b">No alerts</td></tr>';
                return;
            }
            tbody.innerHTML = alerts.map(a => {
                const cls = a.riskLevel === 'CRITICAL' ? 'risk-critical' : a.riskLevel === 'HIGH' ? 'risk-high' : a.riskLevel === 'MEDIUM' ? 'risk-medium' : 'risk-low';
                return `<tr>
                    <td>${a.alertId.substring(0,8)}...</td>
                    <td>${a.agentId.substring(0,8)}...</td>
                    <td class="${cls}">${a.riskLevel}</td>
                    <td>${a.riskScore.toFixed(3)}</td>
                    <td>${a.reason || '-'}</td>
                    <td>${new Date(a.createdAt).toLocaleTimeString()}</td>
                </tr>`;
            }).join('');
        }

        async function updateTransactions() {
            const txs = await fetchJSON(`${API.ledger}/transactions/recent?limit=20`);
            const tbody = document.getElementById('tx-table');
            if (!txs || txs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="color:#64748b">No transactions</td></tr>';
                return;
            }
            tbody.innerHTML = txs.map(tx => {
                const fromId = tx.fromAgentId || tx.from_agent_id || '';
                const toId = tx.toAgentId || tx.to_agent_id || '';
                const isFraud = tx.isFraudLabel || tx.fraudLabel;
                const amount = tx.amount;
                return `<tr>
                    <td>${(tx.txId || tx.tx_id || '').substring(0,8)}...</td>
                    <td>${fromId.substring(0,8)}...</td>
                    <td>${toId.substring(0,8)}...</td>
                    <td>${parseFloat(amount).toFixed(4)} ${tx.currency}</td>
                    <td style="color:${isFraud ? '#ef4444' : '#22c55e'}">${isFraud ? 'FRAUD' : 'Normal'}</td>
                    <td>${new Date(tx.timestamp).toLocaleTimeString()}</td>
                </tr>`;
            }).join('');
        }

        let graphNodes = [];
        let graphEdges = [];
        let nodePositions = {};
        let simulationRunning = false;

        async function loadGraph() {
            const data = await fetchJSON(`${API.features}/graph?window_hours=24`);
            if (!data) return;
            graphNodes = data.nodes || [];
            graphEdges = data.edges || [];
            initializePositions();
            runForceSimulation();
        }

        function initializePositions() {
            nodePositions = {};
            const canvas = document.getElementById('graph-canvas');
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            graphNodes.forEach((n, i) => {
                const angle = (2 * Math.PI * i) / graphNodes.length + Math.random() * 0.5;
                const r = 50 + Math.random() * Math.min(cx, cy) * 0.6;
                nodePositions[n.id] = {
                    x: cx + r * Math.cos(angle),
                    y: cy + r * Math.sin(angle),
                    vx: 0,
                    vy: 0,
                    degree: n.degree || 1
                };
            });
        }

        function runForceSimulation() {
            if (simulationRunning) return;
            simulationRunning = true;
            const canvas = document.getElementById('graph-canvas');
            const W = canvas.width;
            const H = canvas.height;
            const iterations = 150;
            const repulsion = 5000;
            const attraction = 0.005;
            const damping = 0.9;
            const centerForce = 0.01;

            let iter = 0;
            function step() {
                if (iter >= iterations) {
                    simulationRunning = false;
                    drawGraph();
                    return;
                }

                for (const e of graphEdges) {
                    const from = nodePositions[e.source];
                    const to = nodePositions[e.target];
                    if (!from || !to) continue;
                    const dx = to.x - from.x;
                    const dy = to.y - from.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) + 0.1;
                    const force = dist * attraction;
                    const fx = (dx / dist) * force;
                    const fy = (dy / dist) * force;
                    from.vx += fx;
                    from.vy += fy;
                    to.vx -= fx;
                    to.vy -= fy;
                }

                const nodeIds = Object.keys(nodePositions);
                for (let i = 0; i < nodeIds.length; i++) {
                    for (let j = i + 1; j < nodeIds.length; j++) {
                        const a = nodePositions[nodeIds[i]];
                        const b = nodePositions[nodeIds[j]];
                        const dx = b.x - a.x;
                        const dy = b.y - a.y;
                        const distSq = dx * dx + dy * dy + 1;
                        const force = repulsion / distSq;
                        const dist = Math.sqrt(distSq);
                        const fx = (dx / dist) * force;
                        const fy = (dy / dist) * force;
                        a.vx -= fx;
                        a.vy -= fy;
                        b.vx += fx;
                        b.vy += fy;
                    }
                }

                for (const id of nodeIds) {
                    const n = nodePositions[id];
                    n.vx += (W / 2 - n.x) * centerForce;
                    n.vy += (H / 2 - n.y) * centerForce;
                    n.vx *= damping;
                    n.vy *= damping;
                    n.x += n.vx;
                    n.y += n.vy;
                    n.x = Math.max(20, Math.min(W - 20, n.x));
                    n.y = Math.max(20, Math.min(H - 20, n.y));
                }

                iter++;
                if (iter % 5 === 0) drawGraph();
                requestAnimationFrame(step);
            }
            step();
        }

        function drawGraph() {
            const canvas = document.getElementById('graph-canvas');
            const container = document.getElementById('graph-container');
            canvas.width = container.clientWidth;
            canvas.height = 500;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (graphNodes.length === 0) {
                ctx.fillStyle = '#64748b';
                ctx.font = '14px sans-serif';
                ctx.fillText('No graph data. Run simulation first.', canvas.width / 2 - 120, 250);
                return;
            }

            const maxDegree = Math.max(...graphNodes.map(n => n.degree || 1), 1);

            ctx.globalAlpha = 0.15;
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 0.5;
            graphEdges.forEach(e => {
                const from = nodePositions[e.source];
                const to = nodePositions[e.target];
                if (from && to) {
                    ctx.beginPath();
                    ctx.moveTo(from.x, from.y);
                    ctx.lineTo(to.x, to.y);
                    ctx.stroke();
                }
            });
            ctx.globalAlpha = 1.0;

            graphNodes.forEach(n => {
                const pos = nodePositions[n.id];
                if (!pos) return;
                const degree = pos.degree || 1;
                const size = 2 + (degree / maxDegree) * 8;
                const risk = degree > maxDegree * 0.7 ? '#ef4444' : degree > maxDegree * 0.4 ? '#f97316' : '#38bdf8';
                ctx.fillStyle = risk;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, size, 0, 2 * Math.PI);
                ctx.fill();
            });
        }

        async function runSimulation() {
            document.getElementById('status-msg').textContent = 'Running simulation...';
            try {
                const resp = await fetch(`${API.simulator}/run`, { method: 'POST' });
                const data = await resp.json();
                document.getElementById('status-msg').textContent = `Simulated: ${data.totalAgents} agents, ${data.totalTransactions} txs`;
                updateStats();
                updateTransactions();
                loadGraph();
            } catch (e) {
                document.getElementById('status-msg').textContent = 'Simulation failed: ' + e.message;
            }
        }

        async function trainModel() {
            document.getElementById('status-msg').textContent = 'Training models (Isolation Forest + GNN)...';
            try {
                const resp = await fetch(`${API.detection}/train`, { method: 'POST' });
                const data = await resp.json();
                document.getElementById('status-msg').textContent = `Models trained: ${data.samplesTrained} samples`;
            } catch (e) {
                document.getElementById('status-msg').textContent = 'Training failed: ' + e.message;
            }
        }

        updateStats();
        updateAlerts();
        updateTransactions();
        loadGraph();
        setInterval(updateStats, 5000);
        setInterval(updateAlerts, 10000);
    </script>
</body>
</html>
